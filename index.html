<!DOCTYPE html>

<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Courier New', monospace;
        }

        body {
            background-color: #06090e;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: rgba(18, 26, 36, 0.95);
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 255, 106, 0.15);
            border: 1px solid rgba(0, 255, 106, 0.3);
            max-width: 450px;
            width: 100%;
            position: relative;
        }

        /* Profile Logo */
        .logo-box {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #00ff6a, #0088ff);
            box-shadow:
                0 0 20px rgba(0, 255, 106, 0.45),
                0 0 40px rgba(0, 136, 255, 0.15);
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            border: 3px solid #06090e;
        }

        .tag-title {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .tag-title span {
            color: #00ff6a;
            text-shadow: 0 0 12px rgba(0, 255, 106, 0.6);
        }

        .username-badge {
            display: inline-block;
            background: rgba(0, 255, 106, 0.1);
            color: #00ff6a;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #00ff6a;
            margin-bottom: 20px;
        }

        .profit-banner {
            background: #0d1520;
            border-left: 4px solid #00ff6a;
            padding: 12px;
            border-radius: 6px;
            color: #00ff6a;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        p {
            color: #8b949e;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .loader-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #ffcc00;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }

        .btn {
            background: linear-gradient(90deg, #00ff6a, #00cc55);
            color: #06090e;
            text-decoration: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            display: block;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 106, 0.3);
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 106, 0.5);
        }

        .btn:active {
            transform: scale(0.98);
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }

            .tag-title {
                font-size: 27px;
            }

            .logo-box {
                width: 90px;
                height: 90px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        </p>

            ⏳ Redirecting to Telegram in 2 seconds...

            href="https://t.me/KartikArora06"
            class="btn"
            id="telegramBtn"

            JOIN TELEGRAM NOW
